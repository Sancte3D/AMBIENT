  firmware-build-next:
    name: RP2350 build (pico2, firmware-c-next)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential

      - name: Checkout Pico SDK 2.1.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.0"
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule (needed for USB CDC stdio)
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build (pico2 bench tool — display_hw_test)
        working-directory: field-ambience-current/firmware-c-next
        # Since the r18.27 HAL reorg the Pico target is bench-only: the SDK
        # cross-build produces the display_hw_test bring-up tool, not a
        # product firmware (the product moved to STM32H743 — ADR-0002). The
        # -DPICO_BOARD flag auto-selects FAM_TARGET=pico in CMakeLists.txt.
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico2
          make -j"$(nproc)"

      - name: Report size + verify UF2 exists
        working-directory: field-ambience-current/firmware-c-next/build
        run: |
          arm-none-eabi-size display_hw_test.elf
          test -f display_hw_test.uf2
          ls -la display_hw_test.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-pico2-uf2
          path: field-ambience-current/firmware-c-next/build/display_hw_test.uf2
          if-no-files-found: error

  # --- STM32H743 product target: real ARM cross-build gate ----------------
  # The product MCU is STM32H743 (ADR-0002). Since r18.86 the h743 target is a
  # real ARM-GCC/CubeH7 cross-build (not a host-gcc skeleton), so this job
  # installs the ARM toolchain and cross-compiles + links the flashable image.
  # Catches prototype/declaration/HAL regressions in src/hal_h743/** in CI.
  # (Fixed r19.14: the old job installed no ARM toolchain and assumed host gcc
  # — it had been failing at cmake-configure since the r18.86 HAL reorg.)
  h743-crossbuild-next:
    name: STM32H743 ARM cross-build (firmware-c-next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential
      - name: Compile prepared async journal for Cortex-M7 (not integrated)
        working-directory: field-ambience-current/firmware-c-next
        run: |
          mkdir -p build-async-journal-arm
          arm-none-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard -fstack-usage -Iinclude -c src/scenes_journal_async.c -o build-async-journal-arm/scenes_journal_async.o
          arm-none-eabi-nm build-async-journal-arm/scenes_journal_async.o
          test -s build-async-journal-arm/scenes_journal_async.su
      - name: Upload standalone ARM component and stack report
        uses: actions/upload-artifact@v4
        with:
          name: ambient-async-journal-arm-component
          path: field-ambience-current/firmware-c-next/build-async-journal-arm
          if-no-files-found: error
          retention-days: 30
      - name: Compile prepared yielding recovery for Cortex-M7 (not integrated)
        working-directory: field-ambience-current/firmware-c-next
        run: |
          mkdir -p build-journal-recovery-arm
          arm-none-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard -fstack-usage -Iinclude -c src/scenes_journal_recovery.c -o build-journal-recovery-arm/scenes_journal_recovery.o
          arm-none-eabi-nm build-journal-recovery-arm/scenes_journal_recovery.o
          test -s build-journal-recovery-arm/scenes_journal_recovery.su
      - name: Upload standalone ARM recovery component and stack report
        uses: actions/upload-artifact@v4
        with:
          name: ambient-journal-recovery-arm-component
          path: field-ambience-current/firmware-c-next/build-journal-recovery-arm
          if-no-files-found: error
          retention-days: 30
      - name: Compile and partially link prepared Scene Save for Cortex-M7
        # The prepared API is a separate component, never a default image option.
        # Compile both sides of its private SCN7 bridge and partially link them.
        working-directory: field-ambience-current/firmware-c-next
        run: |
          mkdir -p build-scene-save-arm
          for source in scenes scenes_save_async scenes_journal scenes_journal_async scenes_journal_recovery; do
            arm-none-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard -DFAM_SOUND_PRODUCT -DFAM_SCENE_SAVE_ASYNC_PREPARED -fstack-usage -Iinclude -c "src/$source.c" -o "build-scene-save-arm/$source.o"
          done
          arm-none-eabi-ld -r build-scene-save-arm/*.o -o build-scene-save-arm/prepared_scene_save.o
          arm-none-eabi-nm -S build-scene-save-arm/prepared_scene_save.o > build-scene-save-arm/prepared_scene_save.nm
          test -s build-scene-save-arm/scenes_save_async.su
          test -s build-scene-save-arm/scenes.su
          ! grep -E ' U scenes_save_' build-scene-save-arm/prepared_scene_save.nm
