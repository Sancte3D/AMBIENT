name: firmware-c

# Validate the native RP2350 firmware on every push/PR that touches it:
#   1. host-tests  — compile + run the hardware-independent DSP/voice tests
#                     (pure C, no SDK). Fast, deterministic correctness signal.
#   2. firmware-build — full Pico SDK cross-build for the RP2350 (pico2),
#                     proving the codebase still links into a valid UF2.

on:
  push:
    paths:
      - "field-ambience-current/firmware-c/**"
      - "field-ambience-current/firmware-c-next/**"
      - ".github/workflows/firmware-c.yml"
  pull_request:
    paths:
      - "field-ambience-current/firmware-c/**"
      - "field-ambience-current/firmware-c-next/**"
      - ".github/workflows/firmware-c.yml"

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: host unit tests (dsp + voices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        working-directory: field-ambience-current/firmware-c/test
        run: ./run_tests.sh

  firmware-build:
    name: RP2350 build (pico2)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential

      - name: Checkout Pico SDK 2.1.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.0"
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule (needed for USB CDC stdio)
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build (pico2)
        working-directory: field-ambience-current/firmware-c
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico2
          make -j"$(nproc)"

      - name: Report size + verify UF2 exists
        working-directory: field-ambience-current/firmware-c/build
        run: |
          arm-none-eabi-size field_ambience_native.elf
          test -f field_ambience_native.uf2
          ls -la field_ambience_native.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: field_ambience_native-pico2-uf2
          path: field-ambience-current/firmware-c/build/field_ambience_native.uf2
          if-no-files-found: error

  # --- firmware-c-next: the active development tree -----------------------
  # Two-stage validation: host unit tests (incl. Engine V2) + a Pico SDK
  # cross-build. Since the r18.27 HAL reorg the product MCU is STM32H743
  # (ADR-0002); the Pico build is bench-only and produces display_hw_test.uf2
  # — the breadboard bring-up for the 1.9" ST7789 panel
  # (tools/display_hw_test.c). Download it from the workflow artifacts, no
  # local toolchain needed. (The STM32 product build gets CI once the Step
  # 13.3 ARM-GCC toolchain file + linker + startup land.)

  host-tests-next:
    name: host unit tests (firmware-c-next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        working-directory: field-ambience-current/firmware-c-next/test
        run: ./run_tests.sh

  product-audio-review:
    name: short product hearing packs and open gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio measurement tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render and measure short hearing files
        working-directory: field-ambience-current/firmware-c-next
        run: python3 tools/review_product_audio.py build-product-audio
      - name: Render open-gate comparisons from continuous firmware PCM
        working-directory: field-ambience-current/firmware-c-next
        run: python3 tools/build_sound_acceptance.py build-sound-acceptance/review
      - name: Upload complete open-gate audition archive
        uses: actions/upload-artifact@v4
        with:
          name: ambient-sound-acceptance-27s
          path: field-ambience-current/firmware-c-next/build-sound-acceptance/AMBIENT_Sound_Review_2026-10-07.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload separate blind answer key
        uses: actions/upload-artifact@v4
        with:
          name: ambient-sound-acceptance-answer-key-open-after-listening
          path: field-ambience-current/firmware-c-next/build-sound-acceptance/AMBIENT_PRIVATE_BLIND_KEY.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload dry source hearing pack
        uses: actions/upload-artifact@v4
        with:
          name: ambient-dry-sources-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/dry
          if-no-files-found: error
          retention-days: 30
      - name: Upload World hearing pack
        uses: actions/upload-artifact@v4
        with:
          name: ambient-worlds-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/world
          if-no-files-found: error
          retention-days: 30
      - name: Upload Nature hearing pack
        uses: actions/upload-artifact@v4
        with:
          name: ambient-nature-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/nature
          if-no-files-found: error
          retention-days: 30

      - name: Upload Color endpoint hearing pack
        uses: actions/upload-artifact@v4
        with:
          name: ambient-color-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/color
          if-no-files-found: error
          retention-days: 30
      - name: Upload SHAPE endpoint hearing pack
        uses: actions/upload-artifact@v4
        with:
          name: ambient-shape-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/shape
          if-no-files-found: error
          retention-days: 30
      - name: Upload blind dry World comparison
        uses: actions/upload-artifact@v4
        with:
          name: ambient-blind-worlds-27s
          path: field-ambience-current/firmware-c-next/build-product-audio/blind
          if-no-files-found: error
          retention-days: 30

  firmware-build-next:
    name: RP2350 build (pico2, firmware-c-next)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential

      - name: Checkout Pico SDK 2.1.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.0"
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule (needed for USB CDC stdio)
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build (pico2 bench tool — display_hw_test)
        working-directory: field-ambience-current/firmware-c-next
        # Since the r18.27 HAL reorg the Pico target is bench-only: the SDK
        # cross-build produces the display_hw_test bring-up tool, not a
        # product firmware (the product moved to STM32H743 — ADR-0002). The
        # -DPICO_BOARD flag auto-selects FAM_TARGET=pico in CMakeLists.txt.
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico2
          make -j"$(nproc)"

      - name: Report size + verify UF2 exists
        working-directory: field-ambience-current/firmware-c-next/build
        run: |
          arm-none-eabi-size display_hw_test.elf
          test -f display_hw_test.uf2
          ls -la display_hw_test.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-pico2-uf2
          path: field-ambience-current/firmware-c-next/build/display_hw_test.uf2
          if-no-files-found: error

  # --- STM32H743 product target: real ARM cross-build gate ----------------
  # The product MCU is STM32H743 (ADR-0002). Since r18.86 the h743 target is a
  # real ARM-GCC/CubeH7 cross-build (not a host-gcc skeleton), so this job
  # installs the ARM toolchain and cross-compiles + links the flashable image.
  # Catches prototype/declaration/HAL regressions in src/hal_h743/** in CI.
  # (Fixed r19.14: the old job installed no ARM toolchain and assumed host gcc
  # — it had been failing at cmake-configure since the r18.86 HAL reorg.)
  h743-crossbuild-next:
    name: STM32H743 ARM cross-build (firmware-c-next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential
      - name: Cross-build h743 (FAM_TARGET=h743)
        working-directory: field-ambience-current/firmware-c-next
        run: |
          mkdir -p build-h743 && cd build-h743
          # CMakeLists auto-selects cmake/arm-none-eabi-m7.cmake for h743.
          cmake .. -DFAM_TARGET=h743 -DCMAKE_BUILD_TYPE=Release
          cat CMakeFiles/field_ambience_h743.dir/flags.make
          make -j"$(nproc)"
          test -f field_ambience_h743 && echo "h743 cross-build linked OK"
          arm-none-eabi-size field_ambience_h743

      - name: Upload H743 image and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-release
          path: |
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.map
          if-no-files-found: error
          retention-days: 14

      - name: Cross-build reduced product sound candidate
        working-directory: field-ambience-current/firmware-c-next
        run: |
          cmake -S . -B build-h743-product -DFAM_TARGET=h743 -DFAM_SOUND_PROFILE=product -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cat build-h743-product/CMakeFiles/field_ambience_h743.dir/flags.make
          cmake --build build-h743-product -j"$(nproc)"
          python3 tools/check_product_link.py build-h743-product

      - name: Upload reduced sound candidate and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-product-candidate
          path: |
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.map
            field-ambience-current/firmware-c-next/build-h743-product/PRODUCT_BUILD_AUDIT.json
          if-no-files-found: error
          retention-days: 14

      - name: Cross-build experimental recoverable Scene journal
        working-directory: field-ambience-current/firmware-c-next
        run: |
          cmake -S . -B build-h743-journal -DFAM_TARGET=h743 -DFAM_SOUND_PROFILE=product -DFAM_SCENE_JOURNAL_CANDIDATE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-h743-journal -j"$(nproc)"
          python3 tools/check_product_link.py build-h743-journal
          grep -q 'src/scenes_journal.c' build-h743-journal/compile_commands.json
          grep -q 'scene_journal_write' build-h743-journal/field_ambience_h743.map

      - name: Upload experimental Scene journal and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-scene-journal-experimental
          path: |
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.map
            field-ambience-current/firmware-c-next/build-h743-journal/PRODUCT_BUILD_AUDIT.json
          if-no-files-found: error
          retention-days: 14
