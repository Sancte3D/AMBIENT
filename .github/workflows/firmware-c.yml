name: firmware-c

# Validate the native RP2350 firmware on every push/PR that touches it:
#   1. host-tests  — compile + run the hardware-independent DSP/voice tests
#                     (pure C, no SDK). Fast, deterministic correctness signal.
#   2. firmware-build — full Pico SDK cross-build for the RP2350 (pico2),
#                     proving the codebase still links into a valid UF2.

on:
  push:
    paths:
      - "field-ambience-current/firmware-c/**"
      - "field-ambience-current/firmware-c-next/**"
      - ".github/workflows/firmware-c.yml"
  pull_request:
    paths:
      - "field-ambience-current/firmware-c/**"
      - "field-ambience-current/firmware-c-next/**"
      - ".github/workflows/firmware-c.yml"

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: host unit tests (dsp + voices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        working-directory: field-ambience-current/firmware-c/test
        run: ./run_tests.sh

  firmware-build:
    name: RP2350 build (pico2)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential

      - name: Checkout Pico SDK 2.1.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.0"
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule (needed for USB CDC stdio)
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build (pico2)
        working-directory: field-ambience-current/firmware-c
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico2
          make -j"$(nproc)"

      - name: Report size + verify UF2 exists
        working-directory: field-ambience-current/firmware-c/build
        run: |
          arm-none-eabi-size field_ambience_native.elf
          test -f field_ambience_native.uf2
          ls -la field_ambience_native.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: field_ambience_native-pico2-uf2
          path: field-ambience-current/firmware-c/build/field_ambience_native.uf2
          if-no-files-found: error

  # --- firmware-c-next: the active development tree -----------------------
  # Two-stage validation: host unit tests (incl. Engine V2) + a Pico SDK
  # cross-build. Since the r18.27 HAL reorg the product MCU is STM32H743
  # (ADR-0002); the Pico build is bench-only and produces display_hw_test.uf2
  # — the breadboard bring-up for the 1.9" ST7789 panel
  # (tools/display_hw_test.c). Download it from the workflow artifacts, no
  # local toolchain needed. (The STM32 product build gets CI once the Step
  # 13.3 ARM-GCC toolchain file + linker + startup land.)

  host-tests-next:
    name: host unit tests (firmware-c-next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        working-directory: field-ambience-current/firmware-c-next/test
        run: ./run_tests.sh
      - name: Fetch exact pre-expression and pre-character baselines
        run: |
          git fetch --no-tags origin bea7f5765125b2d55c7bb28832626dce7956b382
          git fetch --no-tags origin 49169462c1705a4238bd2194559689b07e22d8c5
          git fetch --no-tags origin 24936b4e19895627d8b4bbdb1ba19a5b05c3db10
          git fetch --no-tags origin b6b62dbf3f33230ea4c659a8f5976efbf4ff31d2
          git fetch --no-tags origin c974584ab24dcb51696d85888ce4125deda20d6f
          git fetch --no-tags origin 8381a1dc8ff85cac71d6b4941b94a6ef82d22e17
          git fetch --no-tags origin df9a8a903d444d48133b980760a9686202455637
      - name: Check current expression, World character and matched baseline PCM
        working-directory: field-ambience-current/firmware-c-next
        run: |
          python3 tools/review_cell_unfold.py build-cell-unfold
          python3 tools/review_world_character.py build-world-character
          python3 tools/review_woodland_body.py build-woodland-body
          python3 tools/review_woodland_resonator.py build-woodland-resonator
          python3 tools/review_sound_finish.py build-sound-finish
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python3 tools/review_nature_accents.py build-sound-finish/nature
          python3 tools/review_ui_idle.py build-sound-finish/ui --fixture-only --finish-candidate --sanitize
          python3 tools/review_h743_irq_scope.py build-cell-unfold/irq --fixture-only --sanitize
          python3 tools/review_ui_idle.py build-cell-unfold/ui --fixture-only --sanitize
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-complete-sound-current-proof-and-wav
          path: field-ambience-current/firmware-c-next/build-sound-finish
          if-no-files-found: error
      - name: Check offline display asset pixel contracts
        working-directory: field-ambience-current/firmware-c-next
        run: |
          python3 -m pip install Pillow
          python3 test/test_ui_asset.py
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-cell-unfold-current-proof-and-wav
          path: field-ambience-current/firmware-c-next/build-cell-unfold
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-world-character-current-proof-and-wav
          path: field-ambience-current/firmware-c-next/build-world-character
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-woodland-body-current-proof-and-wav
          path: field-ambience-current/firmware-c-next/build-woodland-body
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-woodland-resonator-current-proof-and-wav
