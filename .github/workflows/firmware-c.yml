      - name: Install audio measurement tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install numpy
      - name: Verify actual owners, shared Room, latest World and complete PCM
        working-directory: field-ambience-current/firmware-c-next
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python3 tools/review_world_transitions.py build-world-transition-review
      - name: Upload six genuine transition excerpts and complete ownership traces
        uses: actions/upload-artifact@v4
        with:
          name: ambient-world-transitions-50p5s
          path: field-ambience-current/firmware-c-next/build-world-transition-review
          if-no-files-found: error
          retention-days: 30

  firmware-build-next:
    name: RP2350 build (pico2, firmware-c-next)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential

      - name: Checkout Pico SDK 2.1.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.0"
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule (needed for USB CDC stdio)
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build (pico2 bench tool — display_hw_test)
        working-directory: field-ambience-current/firmware-c-next
        # Since the r18.27 HAL reorg the Pico target is bench-only: the SDK
        # cross-build produces the display_hw_test bring-up tool, not a
        # product firmware (the product moved to STM32H743 — ADR-0002). The
        # -DPICO_BOARD flag auto-selects FAM_TARGET=pico in CMakeLists.txt.
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico2
          make -j"$(nproc)"

      - name: Report size + verify UF2 exists
        working-directory: field-ambience-current/firmware-c-next/build
        run: |
          arm-none-eabi-size display_hw_test.elf
          test -f display_hw_test.uf2
          ls -la display_hw_test.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-pico2-uf2
          path: field-ambience-current/firmware-c-next/build/display_hw_test.uf2
          if-no-files-found: error

  # --- STM32H743 product target: real ARM cross-build gate ----------------
  # The product MCU is STM32H743 (ADR-0002). Since r18.86 the h743 target is a
  # real ARM-GCC/CubeH7 cross-build (not a host-gcc skeleton), so this job
  # installs the ARM toolchain and cross-compiles + links the flashable image.
  # Catches prototype/declaration/HAL regressions in src/hal_h743/** in CI.
  # (Fixed r19.14: the old job installed no ARM toolchain and assumed host gcc
  # — it had been failing at cmake-configure since the r18.86 HAL reorg.)
  h743-crossbuild-next:
    name: STM32H743 ARM cross-build (firmware-c-next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake build-essential
      - name: Cross-build h743 (FAM_TARGET=h743)
        working-directory: field-ambience-current/firmware-c-next
        run: |
          mkdir -p build-h743 && cd build-h743
          # CMakeLists auto-selects cmake/arm-none-eabi-m7.cmake for h743.
          cmake .. -DFAM_TARGET=h743 -DCMAKE_BUILD_TYPE=Release
          cat CMakeFiles/field_ambience_h743.dir/flags.make
          make -j"$(nproc)"
          test -f field_ambience_h743 && echo "h743 cross-build linked OK"
          arm-none-eabi-size field_ambience_h743

      - name: Upload H743 image and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-release
          path: |
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743/field_ambience_h743.map
          if-no-files-found: error
          retention-days: 14

      - name: Cross-build reduced product sound candidate
        working-directory: field-ambience-current/firmware-c-next
        run: |
          cmake -S . -B build-h743-product -DFAM_TARGET=h743 -DFAM_SOUND_PROFILE=product -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cat build-h743-product/CMakeFiles/field_ambience_h743.dir/flags.make
          cmake --build build-h743-product -j"$(nproc)"
          python3 tools/check_product_link.py build-h743-product

      - name: Upload reduced sound candidate and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-product-candidate
          path: |
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743-product/field_ambience_h743.map
            field-ambience-current/firmware-c-next/build-h743-product/PRODUCT_BUILD_AUDIT.json
          if-no-files-found: error
          retention-days: 14

      - name: Cross-build experimental recoverable Scene journal
        working-directory: field-ambience-current/firmware-c-next
        run: |
          cmake -S . -B build-h743-journal -DFAM_TARGET=h743 -DFAM_SOUND_PROFILE=product -DFAM_SCENE_JOURNAL_CANDIDATE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-h743-journal -j"$(nproc)"
          python3 tools/check_product_link.py build-h743-journal
          grep -q 'src/scenes_journal.c' build-h743-journal/compile_commands.json
          grep -q 'scene_journal_write' build-h743-journal/field_ambience_h743.map

      - name: Upload experimental Scene journal and linker map
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c-next-h743-scene-journal-experimental
          path: |
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.bin
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.hex
            field-ambience-current/firmware-c-next/build-h743-journal/field_ambience_h743.map
            field-ambience-current/firmware-c-next/build-h743-journal/PRODUCT_BUILD_AUDIT.json
          if-no-files-found: error
          retention-days: 14
